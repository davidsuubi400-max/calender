<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Simple Calendar + Daily Reminders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        /* main app container */
        .calendar-app {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* header */
        .calendar-header {
            background: #1e2f5e;
            color: white;
            padding: 1.2rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .month-year {
            font-size: 1.7rem;
            font-weight: 600;
            background: rgba(255,255,255,0.12);
            padding: 0.2rem 1.2rem;
            border-radius: 48px;
            letter-spacing: 1px;
        }

        .nav-buttons {
            display: flex;
            gap: 0.8rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #ffb347;
            color: #1e2f5e;
            transform: scale(0.96);
        }

        /* weekdays row */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #f8fafd;
            border-bottom: 1px solid #e2e8f0;
            padding: 0.8rem 0;
            font-weight: 700;
            color: #334155;
            text-align: center;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* calendar grid */
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: white;
        }

        .day-cell {
            aspect-ratio: 1 / 1;
            padding: 0.5rem 0.2rem;
            text-align: center;
            border-bottom: 1px solid #f0f2f5;
            border-right: 1px solid #f0f2f5;
            transition: 0.1s ease;
            background: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        .day-cell:nth-child(7n) {
            border-right: none;
        }

        .day-cell:hover {
            background: #eef2ff;
        }

        .empty-cell {
            background: #f9f9fc;
            color: #cbd5e1;
            cursor: default;
        }
        .empty-cell:hover {
            background: #f9f9fc;
        }

        .day-number {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 4px;
            display: block;
        }

        /* reminder indicator (dot) */
        .reminder-dot {
            width: 8px;
            height: 8px;
            background-color: #f97316;
            border-radius: 50%;
            display: inline-block;
            margin-top: 4px;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
        }

        .today {
            background: #1e5f5a !important;
            color: white !important;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .today .reminder-dot {
            background-color: #ffdd99;
        }

        /* right panel: reminder section */
        .reminder-panel {
            background: #ffffff;
            border-top: 2px solid #e2edff;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .selected-date-info {
            font-weight: 600;
            background: #eef2ff;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            display: inline-block;
            width: fit-content;
            font-size: 0.9rem;
            color: #1e2f5e;
        }

        .reminder-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: flex-start;
        }

        .reminder-input {
            flex: 2;
            min-width: 180px;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .reminder-input:focus {
            border-color: #1e5f5a;
            box-shadow: 0 0 0 2px rgba(30,95,90,0.2);
        }

        .add-btn {
            background: #1e5f5a;
            border: none;
            color: white;
            padding: 0.7rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:hover {
            background: #0e4a45;
            transform: scale(0.97);
        }

        .reminder-list {
            background: #fefcf5;
            border-radius: 1.2rem;
            padding: 0.8rem;
            max-height: 160px;
            overflow-y: auto;
        }

        .reminder-item {
            background: white;
            border-left: 4px solid #f97316;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.5rem;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .reminder-text {
            font-size: 0.85rem;
            color: #1e293b;
            word-break: break-word;
            flex: 1;
            padding-right: 0.8rem;
        }

        .delete-reminder {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #94a3b8;
            transition: 0.1s;
            padding: 0 6px;
        }
        .delete-reminder:hover {
            color: #dc2626;
            transform: scale(1.1);
        }
        .no-reminder {
            text-align: center;
            color: #94a3b8;
            font-size: 0.8rem;
            padding: 0.8rem;
        }

        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            padding: 0.6rem;
            background: #f1f5f9;
            color: #475569;
        }

        @media (max-width: 650px) {
            .day-number {
                font-size: 0.85rem;
            }
            .reminder-input-area {
                flex-direction: column;
            }
            .calendar-header {
                padding: 1rem;
            }
            .month-year {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<div class="calendar-app">
    <div class="calendar-header">
        <div class="month-year" id="monthYearDisplay">March 2025</div>
        <div class="nav-buttons">
            <button class="nav-btn" id="prevMonthBtn">←</button>
            <button class="nav-btn" id="todayBtn">●</button>
            <button class="nav-btn" id="nextMonthBtn">→</button>
        </div>
    </div>

    <div class="weekdays">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>

    <div id="calendarGrid" class="calendar-days"></div>

    <!-- Reminder Panel -->
    <div class="reminder-panel">
        <div class="selected-date-info" id="selectedDateInfo">📅 No date selected</div>
        <div class="reminder-input-area">
            <input type="text" id="reminderInput" class="reminder-input" placeholder="Write a reminder... e.g., Dentist at 3 PM" autocomplete="off">
            <button id="addReminderBtn" class="add-btn">➕ Add Reminder</button>
        </div>
        <div id="reminderListContainer" class="reminder-list">
            <div class="no-reminder">✨ Select a date to see reminders</div>
        </div>
    </div>
    <div class="footer-note">
        📌 Click any date → add / view daily reminders | 🔴 Dot = reminder exists
    </div>
</div>

<script>
    // ---------- STORAGE & DATA ----------
    // key: "YYYY-MM-DD" -> array of reminder strings
    let remindersDB = new Map(); 

    // Load from localStorage if available
    function loadRemindersFromStorage() {
        const stored = localStorage.getItem("simple_calendar_reminders");
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                // convert object back to Map
                remindersDB = new Map(Object.entries(parsed));
            } catch(e) { console.warn(e); }
        }
    }

    function saveRemindersToStorage() {
        const obj = Object.fromEntries(remindersDB);
        localStorage.setItem("simple_calendar_reminders", JSON.stringify(obj));
    }

    // Helper: get date key from year, month, day (month is 0-index)
    function getDateKey(year, month, day) {
        // month+1 because we want human month for storage but ensure two-digit
        const mm = String(month + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        return `${year}-${mm}-${dd}`;
    }

    // Get reminders for a specific date
    function getRemindersForDate(year, month, day) {
        const key = getDateKey(year, month, day);
        return remindersDB.get(key) || [];
    }

    // Add a reminder to a specific date
    function addReminderToDate(year, month, day, reminderText) {
        if (!reminderText || reminderText.trim() === "") return false;
        const key = getDateKey(year, month, day);
        const existing = remindersDB.get(key) || [];
        existing.push(reminderText.trim());
        remindersDB.set(key, existing);
        saveRemindersToStorage();
        return true;
    }

    // Delete reminder from a specific date by index
    function deleteReminderFromDate(year, month, day, index) {
        const key = getDateKey(year, month, day);
        const reminders = remindersDB.get(key);
        if (reminders && index >= 0 && index < reminders.length) {
            reminders.splice(index, 1);
            if (reminders.length === 0) {
                remindersDB.delete(key);
            } else {
                remindersDB.set(key, reminders);
            }
            saveRemindersToStorage();
            return true;
        }
        return false;
    }

    // ---------- CALENDAR STATE ----------
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();   // 0-11
    const todayDateObj = new Date();
    let todayYear = todayDateObj.getFullYear();
    let todayMonth = todayDateObj.getMonth();
    let todayDayNum = todayDateObj.getDate();

    // Currently selected date (for reminder panel)
    let selectedYear = currentYear;
    let selectedMonth = currentMonth;
    let selectedDay = null;  // null if no date selected

    // DOM elements
    const monthYearDisplay = document.getElementById('monthYearDisplay');
    const calendarGrid = document.getElementById('calendarGrid');
    const prevBtn = document.getElementById('prevMonthBtn');
    const nextBtn = document.getElementById('nextMonthBtn');
    const todayBtn = document.getElementById('todayBtn');
    const reminderInput = document.getElementById('reminderInput');
    const addReminderBtn = document.getElementById('addReminderBtn');
    const reminderListContainer = document.getElementById('reminderListContainer');
    const selectedDateInfoSpan = document.getElementById('selectedDateInfo');

    // helper: month name
    function getMonthName(monthIndex) {
        return ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][monthIndex];
    }

    // Update reminder panel UI based on selectedYear, selectedMonth, selectedDay
    function updateReminderPanel() {
        if (selectedDay === null) {
            selectedDateInfoSpan.innerText = "📅 No date selected — click a day";
            reminderListContainer.innerHTML = '<div class="no-reminder">✨ Select a date to see reminders</div>';
            return;
        }
        const dateObj = new Date(selectedYear, selectedMonth, selectedDay);
        const formatted = `${getMonthName(selectedMonth)} ${selectedDay}, ${selectedYear}`;
        selectedDateInfoSpan.innerText = `📅 ${formatted}`;
        
        const reminders = getRemindersForDate(selectedYear, selectedMonth, selectedDay);
        if (reminders.length === 0) {
            reminderListContainer.innerHTML = '<div class="no-reminder">📝 No reminders for this day. Add one above ✏️</div>';
            return;
        }
        
        // build list with delete buttons
        const listHtml = [];
        reminders.forEach((rem, idx) => {
            listHtml.push(`
                <div class="reminder-item" data-reminder-index="${idx}">
                    <span class="reminder-text">📌 ${escapeHtml(rem)}</span>
                    <button class="delete-reminder" data-index="${idx}">🗑️</button>
                </div>
            `);
        });
        reminderListContainer.innerHTML = listHtml.join('');
        
        // attach delete events after render
        document.querySelectorAll('.delete-reminder').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute('data-index'));
                if (!isNaN(idx)) {
                    deleteReminderFromDate(selectedYear, selectedMonth, selectedDay, idx);
                    // re-render both calendar (to update dot indicators) and panel
                    renderCalendar();
                    updateReminderPanel();
                }
            });
        });
    }
    
    // simple escape to avoid XSS
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // handle adding reminder for currently selected date
    function handleAddReminder() {
        if (selectedDay === null) {
            alert("Please select a date on the calendar first.");
            return;
        }
        const text = reminderInput.value.trim();
        if (text === "") {
            alert("Please write a reminder message.");
            return;
        }
        const success = addReminderToDate(selectedYear, selectedMonth, selectedDay, text);
        if (success) {
            reminderInput.value = "";
            renderCalendar();        // re-render to update reminder dots
            updateReminderPanel();   // refresh list
        } else {
            alert("Could not add reminder (empty?)");
        }
    }

    // Render calendar completely, highlight today, show reminder dots, and sync selected highlight
    function renderCalendar() {
        const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
        let startWeekday = firstDayOfMonth.getDay(); // 0 sun .. 6 sat
        let startOffset = startWeekday - 1;
        if (startOffset === -1) startOffset = 6;
        
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
        
        let totalCells = 42;
        let calendarCells = [];
        
        // prev month fillers
        let prevMonthStart = prevMonthDays - startOffset + 1;
        for (let i = 0; i < startOffset; i++) {
            let prevDate = prevMonthStart + i;
            let prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
            let prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
            calendarCells.push({
                type: 'prev',
                day: prevDate,
                year: prevYear,
                month: prevMonth,
                isCurrent: false
            });
        }
        
        // current month
        for (let d = 1; d <= daysInMonth; d++) {
            calendarCells.push({
                type: 'current',
                day: d,
                year: currentYear,
                month: currentMonth,
                isCurrent: true
            });
        }
        
        // next month fillers
        let remaining = totalCells - calendarCells.length;
        for (let n = 1; n <= remaining; n++) {
            let nextYear = currentMonth === 11 ? currentYear + 1 : currentYear;
            let nextMonth = currentMonth === 11 ? 0 : currentMonth + 1;
            calendarCells.push({
                type: 'next',
                day: n,
                year: nextYear,
                month: nextMonth,
                isCurrent: false
            });
        }
        
        monthYearDisplay.innerText = `${getMonthName(currentMonth)} ${currentYear}`;
        calendarGrid.innerHTML = '';
        
        // loop & create cells
        for (let cell of calendarCells) {
            const cellDiv = document.createElement('div');
            cellDiv.classList.add('day-cell');
            if (!cell.isCurrent) {
                cellDiv.classList.add('empty-cell');
            }
            
            // check if today
            const isToday = (cell.year === todayYear && cell.month === todayMonth && cell.day === todayDayNum && cell.isCurrent);
            if (isToday) {
                cellDiv.classList.add('today');
            }
            
            // check if this cell matches the selected date (global selection)
            const isSelected = (selectedYear === cell.year && selectedMonth === cell.month && selectedDay === cell.day && cell.isCurrent === true);
            if (isSelected && cell.isCurrent) {
                cellDiv.style.backgroundColor = "#ffedd5";
                cellDiv.style.border = "2px solid #f97316";
                cellDiv.style.borderRadius = "16px";
            } else if (!isSelected && cell.isCurrent && !isToday) {
                cellDiv.style.backgroundColor = "";
                cellDiv.style.border = "";
            }
            
            // reminder indicator? check if there is any reminder for this specific (year, month, day)
            const hasReminder = (() => {
                const key = getDateKey(cell.year, cell.month, cell.day);
                const arr = remindersDB.get(key);
                return arr && arr.length > 0;
            })();
            
            // number span
            const daySpan = document.createElement('span');
            daySpan.classList.add('day-number');
            daySpan.innerText = cell.day;
            cellDiv.appendChild(daySpan);
            
            if (hasReminder && cell.isCurrent) {
                const dotSpan = document.createElement('span');
                dotSpan.classList.add('reminder-dot');
                cellDiv.appendChild(dotSpan);
            } else if (hasReminder && !cell.isCurrent) {
                // optional: show dot on prev/next month filler? but we skip for cleaner view, but we could add a subtle dot? keep simple
                // optional small dot but not necessary
            }
            
            // click handler: select date (only for current month filler cells? but we also allow selecting filler cells? UX: only actual month dates are selectable because reminder typical for specific dates)
            // However to be friendly: when clicking on empty (prev/next month) we will change month and select that date.
            cellDiv.addEventListener('click', (function(y, m, d, isCurr) {
                return function() {
                    if (!isCurr) {
                        // navigate to that month/year and then select the date
                        currentYear = y;
                        currentMonth = m;
                        renderCalendar();
                        // after render set selected
                        selectedYear = y;
                        selectedMonth = m;
                        selectedDay = d;
                        updateReminderPanel();
                        // re-render to highlight new selected (and ensure today not broken)
                        renderCalendar();  // refreshes highlighting
                    } else {
                        // same month, just select
                        selectedYear = y;
                        selectedMonth = m;
                        selectedDay = d;
                        updateReminderPanel();
                        renderCalendar();  // re-highlight
                    }
                };
            })(cell.year, cell.month, cell.day, cell.isCurrent));
            
            calendarGrid.appendChild(cellDiv);
        }
    }
    
    // change month and preserve selected? better to reset selected to null after month change? but we can keep it only if exists
    function changeMonth(delta) {
        let newMonth = currentMonth + delta;
        let newYear = currentYear;
        if (newMonth < 0) {
            newMonth = 11;
            newYear--;
        } else if (newMonth > 11) {
            newMonth = 0;
            newYear++;
        }
        currentMonth = newMonth;
        currentYear = newYear;
        // reset selected day if out of range? but better keep selectedDay = null to avoid confusion
        selectedDay = null;
        selectedYear = currentYear;
        selectedMonth = currentMonth;
        renderCalendar();
        updateReminderPanel(); // shows no date selected
    }
    
    function goToToday() {
        currentYear = todayYear;
        currentMonth = todayMonth;
        selectedDay = todayDayNum;
        selectedYear = todayYear;
        selectedMonth = todayMonth;
        renderCalendar();
        updateReminderPanel();
        // scroll to top feels fine
    }
    
    // Event binding
    prevBtn.addEventListener('click', () => changeMonth(-1));
    nextBtn.addEventListener('click', () => changeMonth(1));
    todayBtn.addEventListener('click', goToToday);
    addReminderBtn.addEventListener('click', handleAddReminder);
    reminderInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleAddReminder();
    });
    
    // initial loading
    loadRemindersFromStorage();
    // set default selected: today's date (initial)
    selectedYear = todayYear;
    selectedMonth = todayMonth;
    selectedDay = todayDayNum;
    renderCalendar();
    updateReminderPanel();
</script>
</body>
</html>
